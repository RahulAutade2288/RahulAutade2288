ize="13" fill="#9ca3af">and credited</text><circle cx="1056" cy="510" r="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/><text x="1056" y="515" text-anchor="middle" font-size="13" font-weight="700" fill="#6ee7b7">6</text><text x="1080" y="515" font-size="16" font-weight="700" fill="#f9fafb">Post</text><text x="1040" y="548" font-size="13" fill="#9ca3af">Funds available to the</text><text x="1040" y="566" font-size="13" fill="#9ca3af">payee</text></svg>
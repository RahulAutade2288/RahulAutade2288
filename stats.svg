<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="130" viewBox="0 0 1280 130"><style>text{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}</style><rect x="0.5" y="0.5" width="1279" height="129" rx="16" fill="#111827" stroke="#1f2937"/><text x="28" y="62" font-size="34" font-weight="700" fill="#10b981">20+</text><text x="28" y="92" font-size="16" fill="#9ca3af">years in bank payments</text><text x="348" y="62" font-size="34" font-weight="700" fill="#10b981">4</text><text x="348" y="92" font-size="16" fill="#9ca3af">tier-1 banks: PNC, BofA, Citi, Shinsei</text><line x1="320" y1="24" x2="320" y2="106" stroke="#374151"/><text x="668" y="62" font-size="34" font-weight="700" fill="#10b981">10+</text><text x="668" y="92" font-size="16" fill="#9ca3af">payment rails delivered</text><line x1="640" y1="24" x2="640" y2="106" stroke="#374151"/><text x="988" y="62" font-size="34" font-weight="700" fill="#10b981">49,632</text><text x="988" y="92" font-size="16" fill="#9ca3af">wires in one day after PNC launch</text><line x1="960" y1="24" x2="960" y2="106" stroke="#374151"/></svg>